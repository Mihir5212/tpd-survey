<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TPD Survey — Ahmedabad</title>
<meta name="description" content="Traffic Police Deployment Foresight Study — Ahmedabad City. Structured questionnaire by SVNIT & DromoLys.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f6; --card:#ffffff; --ink:#1b2333; --muted:#5d6678; --line:#dfe3ea; --line2:#eef0f4;
  --navy:#1c2b4a; --navy2:#273a61; --accent:#e9a21a; --accent-soft:#fdf3dd;
  --ok:#1f8a4c; --warn:#b26a00; --warn-soft:#fff4e0; --err:#c0392b; --err-soft:#fdecea;
  --pick:#1c2b4a; --pick-ink:#ffffff; --radius:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* header */
.top{background:var(--navy);color:#fff}
.top-in{max-width:980px;margin:0 auto;padding:18px 16px 14px}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}
.top h1{margin:4px 0 2px;font-size:22px;line-height:1.25;font-weight:700}
.top p{margin:0;color:#c9d2e3;font-size:14px}
.stripe{height:4px;background:repeating-linear-gradient(90deg,var(--accent) 0 28px,var(--navy) 28px 40px)}

/* sticky nav */
.nav{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 6px rgba(20,30,50,.05)}
.nav-in{max-width:980px;margin:0 auto;padding:8px 16px 0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.chip.done{border-color:#bcd9c8;color:var(--ok);background:#f1f8f4}
.chip.cur{background:var(--navy);border-color:var(--navy);color:#fff}
.bar{height:3px;background:var(--line2)}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}

main{max-width:980px;margin:0 auto;padding:18px 16px 40px}
.sec-head{margin:6px 0 14px}
.sec-head .tag{display:inline-block;background:var(--accent-soft);color:#7a5200;font-weight:700;font-size:13px;border-radius:6px;padding:2px 8px}
.sec-head h2{margin:6px 0 0;font-size:22px;line-height:1.25}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card.err{border-color:var(--err);box-shadow:0 0 0 3px var(--err-soft)}
.qt{font-weight:600;margin:0 0 4px;font-size:16.5px}
.qt .id{color:var(--navy2);margin-right:4px}
.qt .star{color:var(--accent)}
.req{color:var(--err);margin-left:2px}
.note{color:var(--muted);font-size:14px;margin:0 0 10px}
.errmsg{color:var(--err);font-size:14px;margin-top:8px;display:none}
.card.err .errmsg{display:block}

/* options */
.opts{display:grid;gap:6px;margin-top:8px}
.opts.cols2{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:#fff}
.opt:hover{border-color:#b9c2d3}
.opt input{margin-top:3px;accent-color:var(--navy);width:18px;height:18px;flex:0 0 auto}
.opt small{color:var(--muted)}
.opt.other{flex-wrap:wrap}
.opt.other input[type=text]{flex:1 1 180px;margin:0;width:auto;height:auto}
.opt:has(input:checked){border-color:var(--navy);background:#f3f6fb}

input[type=text],input[type=number],input[type=time],input[type=date],select,textarea{
  width:100%;border:1px solid #cfd5df;border-radius:7px;padding:8px 10px;background:#fff;min-height:40px}
input:focus,select:focus,textarea:focus{outline:2px solid #9fb3d9;outline-offset:0;border-color:var(--navy2)}
textarea{min-height:96px;resize:vertical}

.fields{display:grid;gap:10px 14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin-top:8px}
.fields label{display:block;font-size:14px;color:var(--muted);margin-bottom:3px}
.fields .wide{grid-column:1/-1}

/* likert */
.lk{margin-top:8px;border-top:1px solid var(--line2)}
.lrow{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:10px 0;border-bottom:1px solid var(--line2)}
@media(min-width:760px){.lrow{grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px}}
.lq{font-size:15px}
.lopts{display:flex;flex-wrap:wrap;gap:5px}
.pill{position:relative}
.pill input{position:absolute;opacity:0;pointer-events:none}
.pill span{display:inline-block;padding:5px 10px;border:1px solid #cfd5df;border-radius:999px;font-size:13.5px;cursor:pointer;background:#fff;white-space:nowrap;user-select:none}
.pill input:checked+span{background:var(--pick);border-color:var(--pick);color:var(--pick-ink)}
.pill input:focus-visible+span{outline:2px solid #9fb3d9}
.lrow .other-in{margin-top:6px}

/* tables */
.tw{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:8px;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;min-width:520px;font-size:14.5px}
.t th,.t td{border-bottom:1px solid var(--line2);padding:6px 8px;text-align:left;vertical-align:middle}
.t thead th{background:#f6f7fa;font-size:13px;color:var(--muted);font-weight:600;line-height:1.25}
.t tbody th{font-weight:500;min-width:170px;background:#fff;position:sticky;left:0;z-index:1;box-shadow:1px 0 0 var(--line2)}
.t tbody th small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
.t td input,.t td select{min-width:84px;min-height:36px;padding:6px 8px}
.t td.wide input{min-width:170px}
.t tfoot td,.t tfoot th{background:#fbf6ea;font-weight:700;border-bottom:0}
.t tfoot th{position:sticky;left:0}
.addrow{margin-top:8px;background:none;border:1px dashed #b6bfcf;border-radius:7px;padding:6px 12px;color:var(--navy2);font-weight:600;cursor:pointer}
.hint{margin-top:8px;font-size:14px;padding:7px 10px;border-radius:7px;background:#f3f6fb;color:var(--navy2)}
.hint.warn{background:var(--warn-soft);color:var(--warn)}

/* rank */
.rank{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin-top:8px}
.rank label{font-size:14px;color:var(--muted)}
.rlist{margin-top:8px}
.rlist .ri{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line2)}
.rlist .ri select{width:90px;flex:0 0 auto}
.rlist .ri span{flex:1}

/* footer nav */
.pager{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:11px 20px;font-weight:700;cursor:pointer;font-size:16px}
.btn.pri{background:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy2)}
.btn.sec{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.go{background:var(--accent);color:#2a1d00}
.btn:disabled{opacity:.6;cursor:default}
.saved{font-size:13px;color:var(--muted)}
.intro ol{padding-left:20px;margin:6px 0 0}
.intro li{margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted);margin-top:10px}
.legend b{color:var(--ink)}
.foot{max-width:980px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:13px;text-align:center}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.done-box{text-align:center;padding:40px 16px}
.done-box .tick{width:64px;height:64px;border-radius:50%;background:#e7f4ec;color:var(--ok);display:grid;place-items:center;font-size:34px;margin:0 auto 12px}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
@media(max-width:520px){.top h1{font-size:19px}.card{padding:14px 12px}.btn{flex:1}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="kicker">Structured Questionnaire</div>
    <h1>Traffic Police Deployment Foresight Study — Ahmedabad City</h1>
    <p>Assessment of Traffic Policing Duties, Deployment and Operational Requirements</p>
  </div>
  <div class="stripe"></div>
</header>

<nav class="nav" aria-label="Sections">
  <div class="nav-in"><div class="chips" id="chips"></div></div>
  <div class="bar"><i id="bar"></i></div>
</nav>

<main>
  <form id="f" novalidate autocomplete="off">
    <div id="sections"></div>
    <div class="hp" aria-hidden="true"><label>Leave empty <input type="text" id="hp" tabindex="-1"></label></div>
    <div class="pager" id="pager">
      <button type="button" class="btn sec" id="prev">← Back</button>
      <span class="saved" id="saved"></span>
      <button type="button" class="btn pri" id="next">Next →</button>
      <button type="button" class="btn go hidden" id="submit">Submit response</button>
    </div>
  </form>
  <div id="done" class="hidden"></div>
</main>
<div class="foot">Survey Instrument Design and Field Data Collection by SVNIT &amp; DromoLys</div>

<script>
/* ═══════════════════════ CONFIGURATION ═══════════════════════
   Paste your Apps Script Web App URL below (ends with /exec).
   TOKEN must match the TOKEN in Code.gs.                      */
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbyPg5s69tGmXkHPJ427A6PECcF5eXMEkzEE7V2QGiJxTl0Da3Bi557ak3xV7vt6E0TgLA/exec';
const TOKEN    = 'tpd-ahd-2026';
const DRAFT_KEY = 'tpd-survey-draft-v1';

/* ═══════════════════════ SCALES ═══════════════════════ */
const FREQ5=['Never','Rarely','Sometimes','Often','Always'];
const AGREE5=['Strongly disagree','Disagree','Neutral','Agree','Strongly agree'];
const IMPACT5=['No impact','Low','Moderate','High','Very high'];
const IMPORT5=['Not important','Slightly','Moderately','Very','Extremely'];
const AVAIL3=['Not available','Inadequate','Adequate'];
const NEED5=['Not required','Occasionally','Moderately','Mostly','Essential'];
const COORD5=['Never','Rarely','Monthly','Weekly','Daily'];
const TECH5=['Not at all','Slightly','Partly','Largely','Almost fully'];
const CHANGE5=['Decrease a lot','Decrease','No change','Increase','Increase a lot'];
const N15=['1','2','3','4','5'];
const YN=['Y','N'];

const DUTIES=[
 'Traffic Regulation and Field Control (junction, lane, congestion, diversion)',
 'Traffic Law Enforcement (helmet, speeding, red light, wrong-way)',
 'Challan and E-Enforcement (e-challan, CCTV, document checks)',
 'Accident and Crash-Related Duties (crash site, traffic control, reporting)',
 'Road Safety and Preventive Work (blackspots, safety checks, prevention)',
 'Traffic Signal and ITS Operations (signals, CCTV, control room)',
 'Special Event and Crowd Traffic Management (festivals, processions, events)',
 'VIP / VVIP and Protocol Traffic Duty (route clearance, diversions, escort)',
 'Parking and Roadside Management (parking, towing, roadside obstruction)',
 'Public Transport and Commercial Vehicle Management (bus, auto, taxi, heavy vehicles)',
 'Pedestrian and Vulnerable Road User Management (crossings, schools, cyclists)',
 'Emergency and Incident Management (fire, flood, major incidents)',
 'Court, Case and Legal Work (cases, prosecution, court duties)',
 'Inter-Departmental Coordination (RTO, AMC, fire, ambulance)',
 'Traffic Planning and Engineering Support (surveys, junctions, bottlenecks)',
 'Traffic Awareness and Community Outreach (campaigns, schools, awareness)',
 'Administrative and Supervisory Duties (rosters, deployment, supervision, reports)'];

/* helper constructors for table columns */
const N=(label)=>({label,type:'number'});
const T=(label,wide)=>({label,type:'text',wide});
const TM=(label)=>({label,type:'time'});
const SEL=(label,opts)=>({label,type:'select',opts});

/* ═══════════════════════ QUESTIONNAIRE ═══════════════════════
 types: radio, check, fields, likert, table, rank, rankall, textarea  */
const SECTIONS=[
{id:'0',chip:'Start',title:'Survey details & instructions',intro:true,qs:[
 {t:'radio',id:'S1',q:'Mode of survey',opts:['Face-to-face','Self-filled'],req:true},
 {t:'fields',id:'S2',q:'Survey details',fields:[
   {label:'Date of survey',type:'date',req:true},
   {label:'Police station / traffic unit / division',type:'text',req:true},
   {label:'Surveyor name (for face-to-face surveys)',type:'text'}]}
]},
{id:'A',title:'Respondent and duty profile',qs:[
 {t:'radio',id:'A1',q:'Gender',opts:['Male','Female','Prefer not to say'],req:true,inline:true},
 {t:'radio',id:'A2',q:'Age group (years)',opts:['Below 25','25–34','35–44','45–54','55 and above'],req:true,inline:true},
 {t:'radio',id:'A3',q:'Current designation / rank',opts:['TRB Jawan','Police Constable','Head Constable','Assistant Sub-Inspector','Police Sub-Inspector','Police Inspector','Assistant Commissioner of Police and above'],other:true,req:true,inline:true},
 {t:'fields',id:'A4',q:'Experience (years)',fields:[N('Total years in police service'),N('Years in traffic policing'),N('Years in present location')]},
 {t:'radio',id:'A5',q:'Primary type of duty at present (tick ONE)',opts:DUTIES,other:true,req:true},
 {t:'check',id:'A6',q:'Additional duties regularly assigned (tick all that apply)',opts:DUTIES,other:true},
 {t:'table',id:'A7',q:'Main locations of your present duty (up to 3)',note:'Write the junction / corridor name and location type.',rowName:'Location',rowsN:3,cols:[T('Location name',1),T('Remark (location type)',1)]}
]},
{id:'B',title:'Working hours and duty patterns',qs:[
 {t:'check',id:'B1',q:'Your usual shift types (tick all that apply)',other:true,opts:[
  'Morning / Early Shift (e.g., 6 AM–2 PM / 7 AM–3 PM)','Afternoon / Evening Shift (e.g., 2 PM–10 PM / 3 PM–11 PM)','Night Shift (e.g., 10 PM–6 AM)','General / Day Duty (fixed daytime duty)','Two-Shift System (morning + evening)','Three-Shift System (morning + evening + night)','Rotating Shift (shift changes periodically)','Split Shift (morning duty + evening duty)','Peak-Hour / Staggered Duty (deployment during peak traffic hours)','On-Call / Emergency Duty (called in when required)','Special / Event Duty (VIP, festival, procession, special events)']},
 {t:'fields',id:'B2',q:'Usual timings',fields:[TM('Weekday reporting time'),TM('Weekday relieving time'),TM('Weekend reporting time'),TM('Weekend relieving time')]},
 {t:'radio',id:'B3',q:'How often does your shift rotate?',opts:['Fixed','Daily','Weekly','Fortnightly','Monthly','As per requirement','No rotation'],inline:true},
 {t:'table',id:'B4',q:'Time use on a typical duty day',note:'Give approximate hours (e.g., 2.5). The total should equal your total duty hours.',rows:[
   ['a. Fixed-point / Junction Traffic Control','traffic regulation at a designated location'],
   ['b. Mobile Patrol','patrolling and monitoring traffic on assigned routes'],
   ['c. Enforcement / Challan Work','traffic violations, checking, challans/e-challans'],
   ['d. Incident / Crash Handling','road crashes, breakdowns, emergencies, incident management'],
   ['e. Parking / Towing Enforcement','illegal parking, vehicle removal, roadside obstruction'],
   ['f. Travel to / from Duty Location','movement between station and other duty locations'],
   ['g. Waiting / Standby Duty','remaining available for deployment or instructions'],
   ['h. Briefing, Reporting & Paperwork','briefing, registers, reports, documentation'],
   ['i. Meal / Rest Breaks','']],rowOther:'j. Other',cols:[N('Hours per day')],total:true,dutyCheck:true},
 {t:'radio',id:'B5',q:'How often do you work beyond scheduled duty hours?',opts:['Never','1–2 days per month','About 1 day per week','2–3 days per week','Almost daily'],inline:true},
 {t:'fields',id:'B6',q:'When you work extra, how many extra hours on average?',fields:[N('Extra hours per occasion')]},
 {t:'likert',id:'B7',q:'How often are the following the reason for working extra hours?',scale:FREQ5,other:true,rows:['Crash / emergency incident','Heavy congestion','Festivals / events / VIP movement','Administrative / paperwork','Relief personnel not arriving / shortage','Court duty','Enforcement drives']},
 {t:'table',id:'B8',q:'Rest and non-deployable time',note:'Numbers for the LAST 12 MONTHS, approximate.',rows:['Weekly offs entitled per month','Weekly offs actually received per month (average)','Leave days taken in last 12 months','Training days in last 12 months','Court duty days in last 12 months','Days on deputation / bandobast outside traffic in last 12 months'],rowOther:'Other',cols:[N('Number of days')]},
 {t:'radio',id:'B9',q:'If you are posted at one location for your shift (for example, a junction, crossing, or market point), is relief provided for meal / rest breaks?',opts:['Always','Often','Sometimes','Rarely','Never','NA'],inline:true}
]},
{id:'C',title:'Existing manpower and deployment',qs:[
 {t:'table',id:'C1',star:true,q:'Shift structure of your unit on a typical weekday',rows:['Shift 1','Shift 2','Shift 3','Additional peak-hour shift'],cols:[TM('Start time'),TM('End time'),N('Personnel deployed'),N('Overlap with next shift (min)')]},
 {t:'table',id:'C2',star:true,q:'Manpower strength of your unit (numbers)',rows:['ACP & above','PI','PSI','ASI','Head Constable','Constable','TRB jawans'],rowOther:'Other',cols:[N('Sanctioned'),N('In position'),N('Available on a typical day'),N('Deployed on field')],total:true},
 {t:'table',id:'C3',q:'On a typical day, how many personnel of your unit are NOT available due to:',rows:['Leave (all types)','Weekly off','Training','Court duty','Medical / sick','Deputation / bandobast outside unit','Office / administrative work'],rowOther:'Other',cols:[N('Number of personnel')],total:true},
 {t:'table',id:'C4',q:'Present deployment at your main locations',note:'Number of personnel (police + TRB/HG) on a typical weekday by time band. Deployment: R = regular, T = temporary. Shortage: 1 = no shortage … 5 = severe shortage.',rowName:'Location',rowsN:5,minRows:3,cols:[T('Location name',1),N('Morning Peak (MP)'),N('Midday (MD)'),N('Evening Peak (EP)'),N('Night (NT)'),N('Of which TRB (peak)'),N('Weekend (avg)'),SEL('Deployment (R/T)',['R','T']),SEL('Shortage (1–5)',N15)]},
 {t:'check',id:'C5',q:'For locations you rated 4 or 5 (shortage), what are the main reasons? (tick all that apply)',other:true,show:()=>c4High(),opts:['High traffic demand / volume','Insufficient personnel for the number of duty points','Vacant / unfilled posts','Personnel diverted to VIP / bandobast duties','Personnel assigned to special events / festivals','Leave, absenteeism or staff unavailability','Inadequate relief / reserve personnel','Long duty hours / overlapping deployments','Road works / Metro construction / diversions','Adverse weather or difficult field conditions']},
 {t:'radio',id:'C6',q:'Are there any locations or times when traffic police are posted, but their active intervention is usually not required?',opts:['Yes','No'],inline:true},
 {t:'table',id:'C6b',q:'If yes — locations / times where intervention is usually not required',rowName:'Location',rowsN:3,show:()=>S['C6']==='Yes',cols:[T('Location name',1),SEL('Time band',['MP','MD','EP','NT']),N('Personnel posted')]},
 {t:'check',id:'C7',q:'Main reasons for maintaining that deployment (tick all that apply)',other:true,show:()=>S['C6']==='Yes',opts:['Visible police presence / deterrence','VIP / VVIP movement or protocol duty',"Standing orders / senior officers' instructions",'Court / legal requirements','Previous crashes or traffic incidents','High-risk / accident-prone location','Public complaints or requests','Expected increase in traffic demand','Special events / festivals / processions','Traffic-control requirement despite low routine activity']},
 {t:'radio',id:'C8',q:'Who mainly decides deployment at your location? (tick ONE)',other:true,opts:['Pre-planned duty roster / deployment order','PI / Unit In-charge','PSI / Shift Supervisor','Traffic Control Room / ICCC','Senior Traffic Officer (ACP/DCP or above)','On-duty officer based on traffic conditions']},
 {t:'radio',id:'C9',q:'During a typical duty, how many times are you shifted to a different location or task?',opts:['Never','Once','2–3 times','More than 3 times'],inline:true},
 {t:'fields',id:'C10',q:'When shifted, approximately how much time is lost in movement per shift?',fields:[N('Minutes per shift')]},
 {t:'likert',id:'C11',q:'How often is each of the following the reason for shifting you?',scale:FREQ5,other:true,rows:['Crash / incident elsewhere','Congestion at another location','VIP movement','Shortage at another point','Enforcement drive','Patrol requirement','Supervisor / control room instruction']},
 {t:'likert',id:'C12',q:'Please indicate your level of agreement with the following statements about personnel deployment at your location.',scale:AGREE5,rows:['The number of personnel at my location is sufficient during peak hours.','The number of personnel at my location is sufficient during off-peak hours.','Relief personnel are available when required.','Personnel deployment generally matches the level of traffic demand.','TRB are sufficient for routine traffic-control duties at this location.','Personnel deployment is adequate during weekends.']}
]},
{id:'D',title:'Traffic control and routine operational tasks',qs:[
 {t:'table',id:'D1',q:'Routine tasks performed in a typical shift',note:'Leave a row blank if you do not perform that task.',rows:['a. Manual traffic control at junction','b. Queue / spillback management','c. Traffic diversion','d. Pedestrian crossing assistance','e. School / college zone management','f. Market area / encroachment clearance','g. Parking enforcement / towing','h. Helmet / seat-belt / document checks','i. Wrong-side / signal-jumping enforcement','j. Drunk-driving checks','k. Vehicle breakdown / obstruction removal','l. Manual control during signal failure','m. BRTS / bus / auto-rickshaw regulation','n. Public complaints / queries'],rowOther:'o. Other',cols:[N('Times per shift'),N('Avg. minutes each'),N('Personnel needed'),SEL('Needs continuous presence? (Y/N)',YN)]},
 {t:'likert',id:'D2',q:'How necessary is continuous police presence at your main location in each time band?',scale:NEED5,rows:['Morning peak (MP)','Midday (MD)','Evening peak (EP)','Night (NT)','Weekend']},
 {t:'likert',id:'D3',q:'How much does each condition increase the need for ADDITIONAL personnel?',scale:IMPACT5,other:true,rows:['Heavy traffic queues / congestion','Conflicts','Traffic signal failure','High pedestrian activity','Road works / Metro construction','Spillback from nearby junctions','Waterlogging during monsoon','On-street parking / roadside encroachment','Nearby events / public gatherings','VIP / VVIP movement','Road crashes / major incidents','School / college peak periods','Market / commercial-area activity','Special traffic diversions']},
 {t:'radio',id:'D4',q:'Signal status at your main junction',opts:['Adaptive / ATCS','Fixed-time signal','Blinker only','No signal','NA'],inline:true},
 {t:'radio',id:'D5',q:'How often is the signal overridden or controlled manually by police?',opts:['Never','Daily','Few times a week','Few times a month','Throughout peak hours daily'],inline:true},
 {t:'fields',id:'D6',q:'Planned enforcement drives in your unit',fields:[N('Drives per week'),N('Personnel per drive'),N('Duration per drive (hours)')]},

/* ═══════════════════════ COLUMN KEYS ═══════════════════════
   Every answer is stored under a readable column name. */
const rowKey=r=>Array.isArray(r)?r[0]:r;
function tableRows(q){
  if(q.rowsN){const a=[];for(let i=1;i<=q.rowsN;i++)a.push(q.rowName+' '+i);return a;}
  const a=q.rows.map(rowKey); if(q.rowOther)a.push(q.rowOther); return a;
}
function keysOf(q){
  const k=[],id=q.id;
  switch(q.t){
    case 'radio':case 'check':k.push(id);if(q.other)k.push(id+' Other (specify)');break;
    case 'textarea':k.push(id);break;
    case 'fields':q.fields.forEach(f=>k.push(id+' '+f.label));if(q.sum)k.push(id+' TOTAL');break;
    case 'likert':q.rows.forEach(r=>k.push(id+' '+r));if(q.other){k.push(id+' Other (specify)');k.push(id+' Other');}break;
    case 'table':
      if(q.rowOther)k.push(id+' '+q.rowOther+' (specify)');
      tableRows(q).forEach(r=>q.cols.forEach(c=>k.push(id+' '+r+' — '+c.label)));
      if(q.total)q.cols.filter(c=>c.type==='number').forEach(c=>k.push(id+' TOTAL — '+c.label));
      break;
    case 'rank':for(let i=1;i<=q.picks;i++)k.push(id+' Rank '+i);if(q.other)k.push(id+' Other (specify)');break;
    case 'rankall':q.items.forEach(it=>k.push(id+' '+it));if(q.other){k.push(id+' Other (specify)');k.push(id+' Other');}break;
  }
  return k;
}

const COLUMNS=ALLQ.flatMap(keysOf);
const CODEBOOK=ALLQ.flatMap(q=>keysOf(q).map(k=>[k,q.id,q.q]));

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function splitDesc(o){const m=/^(.*?)\s*\((.*)\)\s*$/.exec(o);return m?[m[1],m[2]]:[o,''];}

function inputFor(c,key,cls){
  const k=esc(key);
  if(c.type==='number')return `<input type="number" inputmode="decimal" min="0" step="any" data-k="${k}" aria-label="${k}">`;
  if(c.type==='time')return `<input type="time" data-k="${k}" aria-label="${k}">`;
  if(c.type==='date')return `<input type="date" data-k="${k}" aria-label="${k}">`;
  if(c.type==='select')return `<select data-k="${k}" aria-label="${k}"><option value=""></option>${c.opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
  return `<input type="text" data-k="${k}" aria-label="${k}">`;
}

function renderQ(q){
  const id=q.id, label=id.replace(/b$/,'');
  let h=`<div class="card" id="q-${id}" data-q="${id}"><p class="qt"><span class="id">${esc(label)}.</span>${q.star?'<span class="star">★ </span>':''}${esc(q.q)}${q.req?'<span class="req">*</span>':''}</p>`;
  if(q.note)h+=`<p class="note">${esc(q.note)}</p>`;
  switch(q.t){
  case 'radio':case 'check':{
    const type=q.t==='radio'?'radio':'checkbox';
    h+=`<div class="opts ${q.inline?'cols2':''}">`;
    q.opts.forEach(o=>{const [a,b]=splitDesc(o);
      h+=`<label class="opt"><input type="${type}" name="${esc(id)}" data-k="${esc(id)}" value="${esc(o)}"><span>${esc(a)}${b?` <small>(${esc(b)})</small>`:''}</span></label>`;});
    if(q.other)h+=`<label class="opt other"><input type="${type}" name="${esc(id)}" data-k="${esc(id)}" value="Other"><span>Other:</span><input type="text" data-k="${esc(id)} Other (specify)" data-other-of="${esc(id)}" placeholder="Please specify"></label>`;
    h+='</div>';break;}
  case 'fields':
    h+='<div class="fields">'+q.fields.map(f=>`<div class="${f.wide?'wide':''}"><label>${esc(f.label)}${f.req?'<span class="req">*</span>':''}</label>${inputFor(f,id+' '+f.label)}</div>`).join('')+'</div>';
    if(q.sum)h+=`<div class="hint">Total additional personnel: <b data-sum="${id}">0</b></div>`;
    break;
  case 'textarea':h+=`<textarea data-k="${esc(id)}" placeholder="Type your answer"></textarea>`;break;
  case 'likert':{
    const rows=q.rows.slice(); if(q.other)rows.push('Other');
    h+='<div class="lk">';
    rows.forEach(r=>{const key=id+' '+r;
      h+=`<div class="lrow"><div class="lq">${r==='Other'&&q.other?`<input type="text" class="other-in" data-k="${esc(id)} Other (specify)" placeholder="Other (please specify)">`:esc(r)}</div><div class="lopts">`+
        q.scale.map(s=>`<label class="pill"><input type="radio" name="${esc(key)}" data-k="${esc(key)}" value="${esc(s)}"><span>${esc(s)}</span></label>`).join('')+'</div></div>';});
    h+='</div>';break;}
  case 'table':{
    const rows=tableRows(q);
    h+=`<div class="tw"><table class="t"><thead><tr><th>${q.rowsN?'#':''}</th>${q.cols.map(c=>`<th>${esc(c.label)}</th>`).join('')}</tr></thead><tbody>`;
    const descs=q.rows?q.rows.map(r=>Array.isArray(r)?r[1]:''):[];
    rows.forEach((r,i)=>{
      const isOther=q.rowOther&&i===rows.length-1;
      const hide=q.rowsN&&i>=(META.rows[id]||q.minRows||q.rowsN)?' class="hidden"':'';
      h+=`<tr data-row="${i}"${hide}><th>${isOther?`${esc(q.rowOther)}: <input type="text" data-k="${esc(id+' '+q.rowOther+' (specify)')}" placeholder="specify" style="margin-top:4px">`:esc(r)}${descs[i]?`<small>${esc(descs[i])}</small>`:''}</th>`+
        q.cols.map(c=>`<td class="${c.wide?'wide':''}">${inputFor(c,id+' '+r+' — '+c.label)}</td>`).join('')+'</tr>';});
    h+='</tbody>';
    if(q.total)h+=`<tfoot><tr><th>TOTAL</th>${q.cols.map(c=>`<td>${c.type==='number'?`<span data-total="${esc(id+' TOTAL — '+c.label)}">0</span>`:''}</td>`).join('')}</tr></tfoot>`;
    h+='</table></div>';
    if(q.rowsN&&(q.minRows||q.rowsN)<q.rowsN)h+=`<button type="button" class="addrow" data-add="${id}">+ Add ${esc(q.rowName.toLowerCase())}</button>`;
    if(q.dutyCheck)h+=`<div class="hint" id="dutyhint"></div>`;
    break;}
  case 'rank':{
    const opts=q.items.concat(q.other?['Other (specify)']:[]);
    h+='<div class="rank">';
    for(let i=1;i<=q.picks;i++)h+=`<div><label>Rank ${i}${i===1?' (most time)':''}</label><select data-k="${esc(id+' Rank '+i)}"><option value=""></option>${opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select></div>`;
    h+='</div>';
    if(q.other)h+=`<div style="margin-top:8px"><input type="text" data-k="${esc(id)} Other (specify)" placeholder="If Other — please specify"></div>`;
    h+=`<div class="hint warn hidden" data-rankwarn="${id}">Each item can be chosen only once.</div>`;
    break;}
  case 'rankall':{
    const items=q.items.concat(q.other?['Other']:[]); const n=items.length;
    h+='<div class="rlist">'+items.map(it=>`<div class="ri"><select data-k="${esc(id+' '+it)}" aria-label="Rank for ${esc(it)}"><option value="">—</option>${Array.from({length:n},(_,i)=>`<option>${i+1}</option>`).join('')}</select><span>${it==='Other'?`<input type="text" data-k="${esc(id)} Other (specify)" placeholder="Other (please specify)">`:esc(it)}</span></div>`).join('')+'</div>';
    h+=`<div class="hint warn hidden" data-rankwarn="${id}">Two items have the same rank. Please give each item a different rank.</div>`;
    break;}
  }
  h+=`<div class="errmsg">This question is required.</div></div>`;
  return h;
}

function restore(){
  document.querySelectorAll('[data-k]').forEach(el=>{
    const v=S[el.dataset.k]; if(v==null||v==='')return;
    if(el.type==='checkbox')el.checked=String(v).split('; ').includes(el.value);
    else if(el.type==='radio')el.checked=(v===el.value);
    else el.value=v;
  });
}

/* ═══════════════════════ LOGIC ═══════════════════════ */
function c4High(){for(let i=1;i<=5;i++){const v=+S['C4 Location '+i+' — Shortage (1–5)'];if(v>=4)return true;}return false;}
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0;};
const fmt=n=>Math.round(n*100)/100;
function hoursBetween(a,b){if(!a||!b)return null;const [h1,m1]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number);let d=(h2*60+m2)-(h1*60+m1);if(d<=0)d+=1440;return d/60;}

function update(){
  ALLQ.forEach(q=>{if(q.show){const el=document.getElementById('q-'+q.id);if(el)el.classList.toggle('hidden',!q.show());}});
  // table totals
  ALLQ.filter(q=>q.t==='table'&&q.total).forEach(q=>{
    q.cols.filter(c=>c.type==='number').forEach(c=>{
      const t=tableRows(q).reduce((a,r)=>a+num(S[q.id+' '+r+' — '+c.label]),0);
      const key=q.id+' TOTAL — '+c.label; S[key]=t?String(fmt(t)):'';
      const el=document.querySelector(`[data-total="${CSS.escape(key)}"]`); if(el)el.textContent=fmt(t);
    });
  });
  // G7 sum
  ALLQ.filter(q=>q.sum).forEach(q=>{const t=q.fields.reduce((a,f)=>a+num(S[q.id+' '+f.label]),0);S[q.id+' TOTAL']=t?String(fmt(t)):'';const el=document.querySelector(`[data-sum="${q.id}"]`);if(el)el.textContent=fmt(t);});
  // B4 duty check
  const dh=$('#dutyhint');
  if(dh){const tot=num(S['B4 TOTAL — Hours per day']);const wd=hoursBetween(S['B2 Weekday reporting time'],S['B2 Weekday relieving time']);
    let msg=`Total entered: <b>${fmt(tot)} h</b>`; let warn=false;
    if(wd!=null){msg+=` · Weekday duty from B2: <b>${fmt(wd)} h</b>`; if(tot>0&&Math.abs(tot-wd)>0.5){warn=true;msg+=' — the total does not match your duty hours.';}}
    if(tot>24){warn=true;msg+=' — total is more than 24 hours.';}
    dh.innerHTML=msg; dh.classList.toggle('warn',warn);}
  // rank duplicate warnings
  ALLQ.filter(q=>q.t==='rank'||q.t==='rankall').forEach(q=>{
    const vals=keysOf(q).filter(k=>!k.endsWith('(specify)')).map(k=>S[k]).filter(Boolean);
    const dup=new Set(vals).size!==vals.length;
    const w=document.querySelector(`[data-rankwarn="${q.id}"]`); if(w)w.classList.toggle('hidden',!dup);
  });
}

function onChange(e){
  const el=e.target, k=el.dataset&&el.dataset.k; if(!k)return;
  if(el.type==='checkbox'){S[k]=[...document.querySelectorAll(`input[type=checkbox][data-k="${CSS.escape(k)}"]`)].filter(x=>x.checked).map(x=>x.value).join('; ');}
  else S[k]=el.value;
  // typing in an "Other" box ticks the Other option
  if(el.dataset.otherOf&&el.value){const box=document.querySelector(`input[data-k="${CSS.escape(el.dataset.otherOf)}"][value="Other"]`);if(box&&!box.checked){box.checked=true;box.dispatchEvent(new Event('change',{bubbles:true}));}}
  const card=el.closest('.card'); if(card)card.classList.remove('err');
  update(); saveDraft();
}

/* ═══════════════════════ NAVIGATION ═══════════════════════ */
function nav(){
  document.querySelectorAll('section[data-sec]').forEach(s=>s.classList.toggle('hidden',+s.dataset.sec!==cur));
  document.querySelectorAll('.chip').forEach((c,i)=>{c.classList.toggle('cur',i===cur);c.classList.toggle('done',visited.has(i)&&i!==cur&&i<maxVisited());});
  const chip=document.querySelector(`.chip[data-go="${cur}"]`); if(chip)chip.scrollIntoView({block:'nearest',inline:'center'});
  $('#bar').style.width=((cur)/(SECTIONS.length-1)*100)+'%';
  $('#prev').disabled=cur===0;
  const last=cur===SECTIONS.length-1;
  $('#next').classList.toggle('hidden',last); $('#submit').classList.toggle('hidden',!last);
}
function maxVisited(){return Math.max(...visited)+1;}
function go(i){cur=Math.max(0,Math.min(SECTIONS.length-1,i));visited.add(cur);nav();saveDraft();window.scrollTo({top:0,behavior:'smooth'});}

function missingIn(sec){
  const miss=[];
  sec.qs.forEach(q=>{
    if(q.show&&!q.show())return;
    if(q.req&&!S[q.id])miss.push(q.id);
    if(q.t==='fields')q.fields.forEach(f=>{if(f.req&&!S[q.id+' '+f.label])miss.push(q.id);});
  });
  return [...new Set(miss)];
}
function flagMissing(ids){
  document.querySelectorAll('.card.err').forEach(c=>c.classList.remove('err'));
  ids.forEach(id=>{const el=document.getElementById('q-'+id);if(el)el.classList.add('err');});
  const f=document.getElementById('q-'+ids[0]); if(f)setTimeout(()=>f.scrollIntoView({behavior:'smooth',block:'center'}),60);
}

/* ═══════════════════════ SUBMIT ═══════════════════════ */
function toast(m,ms){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms||3500);}
function payload(){
  const data={};
  ALLQ.forEach(q=>{const hidden=q.show&&!q.show();keysOf(q).forEach(k=>{data[k]=hidden?'':(S[k]??'');});});
  return {token:TOKEN,id:META.id,startedAt:META.started,submittedAt:new Date().toISOString(),
    device:navigator.userAgent.slice(0,180),hp:$('#hp').value,columns:COLUMNS,codebook:CODEBOOK,data};
}
async function submit(){
  for(let i=0;i<SECTIONS.length;i++){const m=missingIn(SECTIONS[i]);if(m.length){go(i);flagMissing(m);toast('Please answer the required question(s) marked *');return;}}
  if(!ENDPOINT||ENDPOINT.startsWith('PASTE')){toast('The survey is not connected yet: ENDPOINT is not set in index.html.',6000);return;}
  const btn=$('#submit');btn.disabled=true;btn.textContent='Submitting…';
  const body=JSON.stringify(payload());
  let ok=false,msg='';
  try{
    const r=await fetch(ENDPOINT,{method:'POST',body,headers:{'Content-Type':'text/plain;charset=utf-8'}});
    const j=await r.json(); ok=!!j.ok; msg=j.error||'';
  }catch(err){
    // Some networks block reading the reply; send again without reading it.
    // The server ignores duplicates (same response ID), so this is safe.
    try{await fetch(ENDPOINT,{method:'POST',body,mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'}});ok=true;}
    catch(e2){ok=false;msg=navigator.onLine?'Could not reach the server.':'You appear to be offline.';}
  }
  btn.disabled=false;btn.textContent='Submit response';
  if(ok){clearDraft();showDone(body);}
  else toast('Not submitted: '+msg+' Your answers are still saved on this device — please try again.',7000);
}
function showDone(body){
  $('#f').classList.add('hidden');document.querySelector('.nav').classList.add('hidden');
  const d=$('#done');d.classList.remove('hidden');
  d.innerHTML=`<div class="card done-box"><div class="tick">✓</div><h2 style="margin:0 0 6px">Response submitted</h2>
  <p class="note">Thank you for your time and cooperation.<br>Response ID: <b>${esc(META.id)}</b></p>
  <div class="pager" style="justify-content:center"><button class="btn sec" id="dl">Download a copy</button><button class="btn pri" id="again">Start a new response</button></div></div>`;
  $('#again').onclick=()=>{location.reload();};
  $('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:'application/json'}));a.download='TPD_response_'+META.id+'.json';a.click();};
  window.scrollTo(0,0);
}

/* ═══════════════════════ START ═══════════════════════ */
const had=loadDraft();
render();
if(had)toast('Your saved draft has been restored.');
$('#f').addEventListener('input',onChange);
$('#f').addEventListener('change',onChange);
$('#f').addEventListener('submit',e=>e.preventDefault());
$('#next').onclick=()=>{const m=missingIn(SECTIONS[cur]);if(m.length){flagMissing(m);toast('Please answer the required question(s) marked *');return;}go(cur+1);};
$('#prev').onclick=()=>go(cur-1);
$('#submit').onclick=submit;
$('#chips').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(+b.dataset.go);});
$('#sections').addEventListener('click',e=>{
  const b=e.target.closest('[data-add]');if(!b)return;
  const q=ALLQ.find(x=>x.id===b.dataset.add);const n=Math.min(q.rowsN,(META.rows[q.id]||q.minRows||q.rowsN)+1);META.rows[q.id]=n;
  document.querySelectorAll(`#q-${q.id} tr[data-row]`).forEach(tr=>tr.classList.toggle('hidden',+tr.dataset.row>=n));
  if(n>=q.rowsN)b.classList.add('hidden'); saveDraft();
});
// restore hidden state of add-row buttons
ALLQ.filter(q=>q.rowsN).forEach(q=>{if((META.rows[q.id]||q.minRows||q.rowsN)>=q.rowsN){const b=document.querySelector(`[data-add="${q.id}"]`);if(b)b.classList.add('hidden');}});
</script>
</body>
